    <style>
      html, body, #root {
        height: 100%;
        margin: 0;

      /* === Skeleton loading screen: source (left) + final (right) === */
      .skeleton-app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f5f5f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      }
      [data-theme="dark"] .skeleton-app {
        background: #111113;
      }
      .skeleton-header {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 16px;
        border-bottom: 1px solid #d9d6cc;
        flex-shrink: 0;
      }
      [data-theme="dark"] .skeleton-header {
        border-color: #3a3a3c;
      }
      .skeleton-header-left,
      .skeleton-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .skeleton-brand {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .01em;
        color: #1d1d18;
        white-space: nowrap;
      }
      .skeleton-brand span {
        margin-left: 6px;
        font-size: 12px;
        font-weight: 500;
        color: #7a7568;
      }
      [data-theme="dark"] .skeleton-brand {
        color: #f5f5f0;
      }
      .skeleton-icon {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      .skeleton-pill {
        width: 64px;
        height: 26px;
        border-radius: 7px;
      }
      .skeleton-main {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }
      .skeleton-pane-toolbar {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        border-bottom: 1px solid #d9d6cc;
        flex-shrink: 0;
      }
      [data-theme="dark"] .skeleton-pane-toolbar {
        border-color: #3a3a3c;
      }
      .skeleton-final-pane {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        overflow: hidden;
      }
      [data-theme="dark"] .skeleton-final-pane {
        background: #161618;
      }
      .skeleton-final-stage {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding: 56px clamp(20px, 4vw, 64px);
      }
      .skeleton-document {
        width: min(100%, 760px);
        margin: 0 auto;
      }
      .skeleton-bar {
        background: linear-gradient(90deg, #a19b8c 25%, #d9d6cc 50%, #a19b8c 75%);
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.5s ease-in-out infinite;
        border-radius: 4px;
      }
      [data-theme="dark"] .skeleton-bar {
        background: linear-gradient(90deg, #2c2c2e 25%, #3a3a3c 50%, #2c2c2e 75%);
        background-size: 200% 100%;
      }
      @keyframes skeleton-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @media (max-width: 767px) {
        .skeleton-header {
          padding: 0 12px;
        }
        .skeleton-header-right .skeleton-pill {
          display: none;
        }
        .skeleton-final-stage {
          padding: 36px 16px;
        }
      }
    </style>
